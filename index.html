<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Spark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="logo-group">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 2L13.5 8.5L20 9.5L15.5 14L16.8 20.5L11 17.5L5.2 20.5L6.5 14L2 9.5L8.5 8.5L11 2Z" fill="currentColor"/>
          </svg>
        </div>
        <span class="app-name">Content Spark</span>
      </div>
      <p class="app-tagline">Turn your ideas into scroll-stopping social content — instantly.</p>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <div class="container">

      <!-- INPUT SECTION -->
      <section class="input-section" id="inputSection">
        <div class="section-label">
          <span class="step-dot">01</span>
          <span>Tell us about your content</span>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="niche">Niche or Topic</label>
            <input
              type="text"
              id="niche"
              placeholder="e.g. Digital products, fitness, finance..."
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="audience">Target Audience</label>
            <input
              type="text"
              id="audience"
              placeholder="e.g. Young creators, small business owners..."
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="postType">Type of Post</label>
            <div class="select-wrapper">
              <select id="postType">
                <option value="" disabled selected>Select post type</option>
                <option value="Educational">Educational</option>
                <option value="Promotional">Promotional</option>
                <option value="Storytelling">Storytelling</option>
                <option value="Engagement">Engagement</option>
                <option value="Authority">Authority</option>
                <option value="Conversion">Conversion</option>
              </select>
              <span class="select-arrow">&#8964;</span>
            </div>
          </div>

          <div class="form-group">
            <label for="platform">Platform</label>
            <div class="select-wrapper">
              <select id="platform">
                <option value="" disabled selected>Select platform</option>
                <option value="Instagram">Instagram</option>
                <option value="LinkedIn">LinkedIn</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Twitter">Twitter</option>
                <option value="Facebook">Facebook</option>
              </select>
              <span class="select-arrow">&#8964;</span>
            </div>
          </div>

          <div class="form-group">
            <label for="tone">Tone</label>
            <div class="select-wrapper">
              <select id="tone">
                <option value="" disabled selected>Select tone</option>
                <option value="Friendly">Friendly</option>
                <option value="Professional">Professional</option>
                <option value="Bold">Bold</option>
                <option value="Inspiring">Inspiring</option>
                <option value="Conversational">Conversational</option>
              </select>
              <span class="select-arrow">&#8964;</span>
            </div>
          </div>
        </div>

        <button class="generate-btn" id="generateBtn" onclick="generateContent()">
          <span class="btn-text">Generate Content</span>
          <span class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M9 1L11 7H17L12.5 11L14 17L9 13.5L4 17L5.5 11L1 7H7L9 1Z" fill="currentColor"/>
            </svg>
          </span>
          <span class="btn-loader" id="btnLoader" style="display:none;">
            <span class="spinner"></span>
            Generating...
          </span>
        </button>
      </section>

      <!-- OUTPUT SECTION -->
      <section class="output-section" id="outputSection" style="display:none;">
        <div class="section-label">
          <span class="step-dot">02</span>
          <span>Your generated content</span>
        </div>

        <div class="output-meta" id="outputMeta"></div>

        <div class="output-box">
          <textarea id="outputText" readonly placeholder="Your content will appear here..."></textarea>
          <div class="char-count" id="charCount"></div>
        </div>

        <div class="output-actions">
          <button class="action-btn copy-btn" id="copyBtn" onclick="copyContent()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            Copy
          </button>
          <button class="action-btn regen-btn" id="regenBtn" onclick="regenerateContent()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M13.5 2.5A6.5 6.5 0 012.5 8M2.5 13.5A6.5 6.5 0 0013.5 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M13.5 2.5V5.5H10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2.5 13.5V10.5H5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Regenerate
          </button>
        </div>
      </section>

      <!-- ERROR STATE -->
      <div class="error-box" id="errorBox" style="display:none;">
        <span id="errorMsg"></span>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>Built with AI &nbsp;|&nbsp; <strong>Winner Okoro</strong></p>
  </footer>

  <script src="script.js"></script>
</body>
                  </html>
